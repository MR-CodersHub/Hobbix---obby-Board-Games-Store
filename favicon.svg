<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ff6b00" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a133a" />
      <stop offset="100%" stop-color="#0b071e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3" />
  <!-- D20 / Hexagonal Gaming Dice Icon with 'H' Motif -->
  <g transform="translate(50, 50) scale(0.9)" filter="url(#glow)">
    <!-- Hexagon Outer -->
    <polygon points="0,-36 31.2,-18 31.2,18 0,36 -31.2,18 -31.2,-18" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round" />
    <!-- Internal Facets -->
    <line x1="0" y1="-36" x2="0" y2="36" stroke="url(#goldGrad)" stroke-width="3" />
    <line x1="31.2" y1="-18" x2="-31.2" y2="18" stroke="url(#goldGrad)" stroke-width="3" />
    <line x1="-31.2" y1="-18" x2="31.2" y2="18" stroke="url(#goldGrad)" stroke-width="3" />
    <!-- Inner Center Triangle -->
    <polygon points="0,-18 15.6,9 -15.6,9" fill="url(#goldGrad)" opacity="0.85" />
  </g>
</svg>
